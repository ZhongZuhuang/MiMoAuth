[workspace]
resolver = "2"
members = [
    "crates/mimoauth-common",
    "crates/mimoauthd",
    "crates/mimoauthctl",
    "crates/mimoauth-gui",
    "crates/mimoauth-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
mimoauth-common = { path = "crates/mimoauth-common" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
globset = "0.4"
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-std"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
libc = "0.2"

[profile.release]
lto = true
strip = true
